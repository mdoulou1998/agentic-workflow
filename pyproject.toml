[project]
name = "agentic-workflow"
version = "0.0.0"
description = "Multi-agent apprenticeship evidence assessment (skeleton)"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.22.0",
    "mypy>=2.3.1",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# Dev tooling and optional uv config are managed by `uv` and its lockfile.
