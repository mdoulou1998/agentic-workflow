name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tooling and deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff mypy python-dotenv pydantic

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy src tests

      - name: Run tests
        run: pytest -q
